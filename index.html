<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Web GIS - Sleman & Flores</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; }
        #map { width: 100%; height: 100vh; }
        #tombol {
            position: absolute;
            top: 10px;
            left: 55px;
            z-index: 1000;
        }
        button {
            padding: 8px 12px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="tombol">
        <button onclick="tampilSleman()">Sleman</button>
        <button onclick="tampilFlores()">Flores</button>
        <button onclick="tampilKeduanya()">Tampilkan Keduanya</button>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="lib/L.Geoserver.js"></script>

    <script>
        var map = L.map("map").setView([-8.0, 116.5], 6);

        var osm = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        var url = "http://localhost:8080/geoserver/wms";

        // 1. Layer Flores
        var flores1 = L.Geoserver.wms(url, { layers: "pgweb:batas_kecamatan", transparent: true });
        var flores2 = L.Geoserver.wms(url, { layers: "pgweb:jalan", transparent: true });
        var flores3 = L.Geoserver.wms(url, { layers: "pgweb:toponimi", transparent: true });
        var grupFlores = L.layerGroup([flores1, flores2, flores3]).addTo(map);

        // 2. Layer Sleman
        var sleman1 = L.Geoserver.wms(url, { layers: "pgweb:kecamatan_sleman", transparent: true });
        var sleman2 = L.Geoserver.wms(url, { layers: "pgweb:penduduk_sleman", transparent: true });
        var grupSleman = L.layerGroup([sleman1, sleman2]).addTo(map);

        // 3. Fungsi Tombol
        function tampilSleman() {
            map.removeLayer(grupFlores);
            map.addLayer(grupSleman);
            map.setView([-7.7156, 110.3556], 11);
        }

        function tampilFlores() {
            map.removeLayer(grupSleman);
            map.addLayer(grupFlores);
            map.setView([-8.3500, 123.0000], 10);
        }

        function tampilKeduanya() {
            map.addLayer(grupSleman);
            map.addLayer(grupFlores);
            map.setView([-8.0, 116.5], 6);
        }

        // 4. Legenda Pojok Kiri Bawah
        var legend = L.control({ position: "bottomleft" });
        legend.onAdd = function () {
            var div = L.DomUtil.create("div", "info legend");
            div.style.background = "white";
            div.style.padding = "10px";
            div.style.maxHeight = "250px";
            div.style.overflowY = "auto";
            L.DomEvent.disableScrollPropagation(div);

            var baseUrl = url + "?REQUEST=GetLegendGraphic&VERSION=1.0.0&FORMAT=image/png&WIDTH=15&HEIGHT=15&LAYER=";
            div.innerHTML =
                "<b>Kecamatan Sleman</b><br><img src='" + baseUrl + "pgweb:kecamatan_sleman'><br><br>" +
                "<b>Penduduk Sleman</b><br><img src='" + baseUrl + "pgweb:penduduk_sleman'><br><br>" +
                "<b>Batas Kecamatan</b><br><img src='" + baseUrl + "pgweb:batas_kecamatan'><br><br>" +
                "<b>Jalan</b><br><img src='" + baseUrl + "pgweb:jalan'><br><br>" +
                "<b>Toponimi</b><br><img src='" + baseUrl + "pgweb:toponimi'>";
            return div;
        };
        legend.addTo(map);

        // 5. Kontrol Layer Pojok Kanan Atas
        L.control.layers(
            { "OpenStreetMap": osm },
            {
                "Kecamatan Sleman": sleman1,
                "Penduduk Sleman": sleman2,
                "Batas Kecamatan Flores": flores1,
                "Jalan Flores": flores2,
                "Toponimi Flores": flores3
            }
        ).addTo(map);
    </script>
</body>
</html>
